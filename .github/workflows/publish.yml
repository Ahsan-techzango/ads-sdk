name: Publish Ads Library

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build & publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :ads-library:publishReleasePublicationToGitHubPackagesRepository \
            -PVERSION_NAME=${{ steps.version.outputs.VERSION }}

      # Optional: also build the release AAR for manual download
      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ads-library-aar
          path: ads-library/build/outputs/aar/*.aar
